<!doctype html>
<html lang="id">
<head>
	<meta charset="UTF-8" />
	<link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description"
		content="Vila privat dengan kolam renang di tebing buluh Loksado. Cek sendiri tanggal yang masih kosong, lalu booking langsung via WhatsApp." />
	<meta property="og:title" content="Villa Tebing Buluh" />
	<meta property="og:description"
		content="Vila privat dengan kolam renang di tebing buluh. Cek tanggal kosong dan booking via WhatsApp." />
	<meta property="og:type" content="website" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="preconnect" href="https://images.unsplash.com" />
	<!-- LCP: hero Home (heroImage di demoData.js) - mulai fetch sebelum JS mount.
	     imagesrcset/imagesizes disamakan dengan srcset di HeroSection.vue supaya
	     browser mem-preload varian yang sama yang akan dipakai <img>. -->
	<link rel="preload" as="image" fetchpriority="high"
		href="https://images.unsplash.com/photo-1721222204314-46922f2aada0?auto=format&fit=crop&w=2000&q=80"
		imagesrcset="https://images.unsplash.com/photo-1721222204314-46922f2aada0?auto=format&fit=crop&w=640&q=80 640w, https://images.unsplash.com/photo-1721222204314-46922f2aada0?auto=format&fit=crop&w=828&q=80 828w, https://images.unsplash.com/photo-1721222204314-46922f2aada0?auto=format&fit=crop&w=1080&q=80 1080w, https://images.unsplash.com/photo-1721222204314-46922f2aada0?auto=format&fit=crop&w=1600&q=80 1600w, https://images.unsplash.com/photo-1721222204314-46922f2aada0?auto=format&fit=crop&w=2000&q=80 2000w"
		imagesizes="100vw" />
	<!-- Font non-blocking: preload lalu swap ke stylesheet (media trick), supaya
	     tidak menahan render awal - noscript untuk fallback JS mati. Swap-nya
	     dilakukan di main.js (bukan onload= inline) karena CSP script-src 'self'
	     di vercel.json memblokir atribut event inline (script-src-attr). -->
	<link rel="preload" as="style"
		href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" />
	<link id="gfonts-stylesheet"
		href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap"
		rel="stylesheet" media="print">
	<noscript>
		<link
			href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap"
			rel="stylesheet">
	</noscript>
	<title>Villa Tebing Buluh · Vila Privat di Tebing Buluh Loksado</title>
</head>
<body>
	<div id="app"></div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
